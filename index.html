<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chicago Shia League - Season 3</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* Navigation */
        nav {
            background: #000;
            padding: 1rem 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 50px;
            height: 50px;
            background-image: url('images/league-logo.jpeg');
            background-size: cover;
            background-position: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logo:hover {
            transform: scale(1.05);
        }

        .league-name {
            font-size: 1.5rem;
            font-weight: bold;
            color: #FF6B35;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s;
        }

        .nav-links a:hover {
            background: #FF6B35;
            transform: translateY(-2px);
        }

        .nav-links a.active {
            background: #FF6B35;
        }

        /* ========== MOBILE NAVIGATION - BULLET PROOF ========== */
        /* Hide mobile nav on desktop, show on mobile */
        .mobile-nav {
            display: none;
        }

        /* Mobile Navigation Styles */
        @media (max-width: 768px) {
            /* Hide desktop navigation completely on mobile */
            nav {
                display: none !important;
            }

            /* Show mobile navigation */
            .mobile-nav {
                display: block;
                background: #000;
                position: sticky;
                top: 0;
                z-index: 1000;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            }

            .mobile-nav-container {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 1rem;
                max-width: 100%;
            }

            .mobile-logo-section {
                display: flex;
                align-items: center;
                gap: 1rem;
            }

            .mobile-logo {
                width: 40px;
                height: 40px;
                background-image: url('images/league-logo.jpeg');
                background-size: cover;
                background-position: center;
                border-radius: 50%;
                cursor: pointer;
                transition: all 0.3s;
            }

            .mobile-logo:hover {
                transform: scale(1.05);
            }

            .mobile-league-name {
                font-size: 1.2rem;
                font-weight: bold;
                color: #FF6B35;
            }

            .mobile-menu-toggle {
                background: #FF6B35;
                border: none;
                color: #fff;
                font-size: 1.5rem;
                padding: 0.5rem;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s;
            }

            .mobile-menu-toggle:hover {
                background: #ff8c61;
            }

            .mobile-nav-links {
                display: none;
                background: #000;
                border-top: 1px solid rgba(255, 107, 53, 0.3);
                padding: 1rem;
            }

            .mobile-nav-links.active {
                display: block;
            }

            .mobile-nav-links ul {
                list-style: none;
                margin: 0;
                padding: 0;
            }

            .mobile-nav-links li {
                margin-bottom: 0.5rem;
            }

            .mobile-nav-links a {
                color: #fff;
                text-decoration: none;
                padding: 0.75rem 1rem;
                display: block;
                border-radius: 5px;
                transition: all 0.3s;
            }

            .mobile-nav-links a:hover {
                background: #FF6B35;
            }

            .mobile-nav-links a.active {
                background: #FF6B35;
            }
        }

        /* Hero Section */
        .hero {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: clamp(320px, 60vh, 560px);
            overflow: hidden;
            color: #fff;
            background: #111;
        }

        .hero-slider {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .hero-slide {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transform: scale(1.06);
            transition: opacity 1.4s ease-in-out, transform 6s ease;
            will-change: opacity, transform;
        }

        .hero-slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.65) 0%, rgba(0, 0, 0, 0.35) 100%);
            opacity: 0;
            transition: opacity 1.4s ease-in-out;
            pointer-events: none;
        }

        .hero-slide.active {
            opacity: 1;
            transform: scale(1);
            z-index: 1;
        }

        .hero-slide.active::after {
            opacity: 1;
        }

        .hero-overlay {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            text-align: center;
            padding: clamp(1.5rem, 3vw, 3rem);
            width: min(90%, 720px);
        }

        .season-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: rgba(255, 255, 255, 0.26);
            padding: 0.65rem 2.25rem;
            border-radius: 999px;
            font-size: clamp(1rem, 1.1vw + 0.8rem, 1.6rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            box-shadow: none;
            mix-blend-mode: screen;
            -webkit-text-stroke: 0.75px rgba(255, 255, 255, 0.25);
            text-shadow: 0 25px 45px rgba(0, 0, 0, 0.65);
        }

        .week-info {
            font-size: clamp(1.8rem, 2.4vw + 1.4rem, 3.2rem);
            font-weight: 700;
            line-height: 1.1;
            color: rgba(255, 255, 255, 0.28);
            mix-blend-mode: screen;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.22);
            text-shadow: 0 28px 55px rgba(0, 0, 0, 0.7);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Section Headers */
        .section-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 3px solid #FF6B35;
        }

        .section-header h2 {
            font-size: 2rem;
            color: #FF6B35;
        }

        /* Game Cards */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 107, 53, 0.3);
            transition: all 0.3s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 107, 53, 0.3);
            border-color: #FF6B35;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .game-date {
            color: #FF6B35;
            font-weight: bold;
        }

        .matchup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        .team {
            text-align: center;
            flex: 1;
        }

        .team-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .score {
            font-size: 2rem;
            font-weight: bold;
            color: #FF6B35;
        }

        .vs {
            font-size: 1.5rem;
            color: #888;
            padding: 0 1rem;
        }

        .game-leaders {
            margin-top: 1.5rem;
        }

        .game-leaders h4 {
            color: #FF6B35;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .leader-stat {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem;
            margin-bottom: 0.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 5px;
        }

        .stat-category {
            color: #FF6B35;
            font-weight: bold;
        }

        .player-stat {
            text-align: right;
        }

        /* Loading State */
        .loading {
            text-align: center;
            padding: 3rem;
            font-size: 1.2rem;
            color: #888;
        }

        /* Mobile Menu Toggle */
        .menu-toggle {
            display: none;
            background: #FF6B35;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-container {
                position: relative;
            }

            .logo-section {
                justify-content: space-between;
                align-items: center;
            }

            .league-name {
                display: none; /* Hide league name on mobile */
            }

            .nav-links {
                display: none;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: #000;
                flex-direction: column;
                gap: 0.5rem;
                padding: 1rem;
                border-radius: 0 0 10px 10px;
                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                z-index: 99;
            }

            .nav-links.active {
                display: flex;
            }

            .menu-toggle {
                display: block;
                background: #FF6B35;
                border: none;
                color: #fff;
                font-size: 1.5rem;
                padding: 0.5rem;
                border-radius: 5px;
                cursor: pointer;
                transition: all 0.3s;
            }

            .menu-toggle:hover {
                background: #ff8c61;
            }

            .games-grid {
                grid-template-columns: 1fr;
            }

            .section-header h2 {
                font-size: 1.5rem;
            }

            /* Fix nav bar boundaries */
            .nav-container {
                max-width: 100%;
            }

            /* Prevent horizontal scroll */
            body {
                overflow-x: hidden;
            }

            .container {
                max-width: 100%;
                padding: 1rem;
            }

            .hero {
                min-height: clamp(280px, 55vh, 420px);
            }

            .hero-overlay {
                gap: 1rem;
                padding: clamp(1.25rem, 4vw, 2rem);
            }

            .season-badge {
                padding: 0.6rem 1.75rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="logo-section">
                <div class="logo" onclick="goHome()"></div>
                <div class="league-name">Chicago Shia League</div>
                <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html" class="active">Home</a></li>
                <li><a href="games.html">Games by Week</a></li>
                <li><a href="players.html">Player Stats</a></li>
                <li><a href="leaders.html">Leaders</a></li>
                <li><a href="admin.html">Admin 🔒</a></li>
            </ul>
        </div>
    </nav>

    <!-- Mobile Navigation (Hidden on Desktop) -->
    <div class="mobile-nav">
        <div class="mobile-nav-container">
            <div class="mobile-logo-section">
                <div class="mobile-logo" onclick="mobileGoHome()"></div>
                <div class="mobile-league-name">Chicago Shia League</div>
            </div>
            <button class="mobile-menu-toggle" onclick="mobileToggleMenu()">☰</button>
        </div>
        <div class="mobile-nav-links" id="mobileNavLinks">
            <ul>
                <li><a href="index.html" class="mobile-nav-link active">Home</a></li>
                <li><a href="games.html" class="mobile-nav-link">Games by Week</a></li>
                <li><a href="players.html" class="mobile-nav-link">Player Stats</a></li>
                <li><a href="leaders.html" class="mobile-nav-link">Leaders</a></li>
                <li><a href="admin.html" class="mobile-nav-link">Admin 🔒</a></li>
            </ul>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <div class="hero-slider" id="heroSlider" aria-hidden="true"></div>
        <div class="hero-overlay">
            <div class="season-badge">⛹️ SEASON 3</div>
            <div class="week-info">Latest Games</div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Latest Games Section -->
        <div class="section-header">
            <h2>🏀 Latest Week's Games</h2>
        </div>

        <div class="games-grid" id="gamesContainer">
            <div class="loading">Loading latest week's games...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

    <!-- Config -->
    <script src="js/config.js"></script>

    <!-- Homepage JavaScript -->
    <script src="js/home.js"></script>

    <script>
        // Desktop menu toggle (legacy - keep for compatibility)
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            if (navLinks) {
                navLinks.classList.toggle('active');
            }
        }

        // Desktop logo home button (legacy - keep for compatibility)
        function goHome() {
            window.location.href = 'index.html';
        }

        // Mobile menu toggle
        function mobileToggleMenu() {
            const mobileNavLinks = document.getElementById('mobileNavLinks');
            if (mobileNavLinks) {
                mobileNavLinks.classList.toggle('active');
            }
        }

        // Mobile logo home button
        function mobileGoHome() {
            window.location.href = 'index.html';
        }

        // Handle mobile navigation active states
        document.addEventListener('DOMContentLoaded', function() {
            // Update mobile nav active state based on current page
            const currentPath = window.location.pathname;
            const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');

            mobileNavLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === currentPath.substring(currentPath.lastIndexOf('/'))) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
